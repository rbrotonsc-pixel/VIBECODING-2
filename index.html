<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiempo en directo</title>
    <link rel="stylesheet" href="/src/web/styles.css" />
  </head>
  <body>
    <main>
      <h1 id="app-name"></h1>
      <form id="search" class="search">
        <label for="city">Ciudad</label>
        <input id="city" name="city" type="text" autocomplete="off" placeholder="p. ej. Madrid" />
        <button type="submit">Buscar</button>
      </form>
      <p id="message" class="message" role="alert"></p>
      <ul id="choices" class="choices" aria-label="Coincidencias"></ul>
      <section id="current" class="card" aria-live="polite">
        <div class="now">
          <span id="sky-icon" class="sky-icon" aria-hidden="true"></span>
          <div>
            <p id="summary" class="summary"></p>
            <p id="details" class="details"></p>
          </div>
        </div>
        <div class="status">
          <span id="updated-at"></span>
          <button id="refresh" type="button" hidden>Actualizar</button>
        </div>
      </section>
      <section id="chart-card" class="card" hidden>
        <h2>Temperatura</h2>
        <svg id="chart" class="chart" role="img" aria-label="Evolución de la temperatura"></svg>
        <p class="legend"><span class="key key-measured"></span> Medida en esta sesión</p>
      </section>
    </main>
    <script type="module" src="/src/web/main.js"></script>
  </body>
</html>
